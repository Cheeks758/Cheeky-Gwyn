<!DOCTYPE html>
<html>
<head>
  <title>Cheeky Gwyn Test</title>
</head>

<body>

<h1>Cheeky Gwyn 💕 Firebase Test</h1>

<button onclick="sendTest()">Send Message 💌</button>

<div id="messages"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAxc1R3tWD6OVOEMfWPvhdJNmT5FWmCJE",
    authDomain: "cheekygwyn.firebaseapp.com",
    projectId: "cheekygwyn",
    storageBucket: "cheekygwyn.appspot.com",
    messagingSenderId: "600138508957",
    appId: "1:600138508957:web:385a5016b22ee981428274"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Send message
  window.sendTest = async function () {
    await addDoc(collection(db, "test"), {
      message: "Hello from Cheeky Gwyn 💕",
      time: Date.now()
    });
  };

  // Live updates
  onSnapshot(collection(db, "test"), (snapshot) => {
    const box = document.getElementById("messages");
    box.innerHTML = "";

    snapshot.forEach(doc => {
      box.innerHTML += `<p>💌 ${doc.data().message}</p>`;
    });
  });

</script>

</body>
</html>
